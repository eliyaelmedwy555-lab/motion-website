<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion · אתר שמביא לקוחות</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx?v=4"></script>

<script>
(function() {
  var canvas = document.createElement('canvas');
  canvas.id = 'hero-shader';

  function inject() {
    var hero = document.querySelector('.hero-new');
    if (!hero) { requestAnimationFrame(inject); return; }
    hero.insertBefore(canvas, hero.firstChild);
    initGL(canvas);
  }
  requestAnimationFrame(inject);

  function initGL(canvas) {
    var gl = canvas.getContext('webgl2');
    if (!gl) { canvas.style.display = 'none'; return; }

    var VERT = '#version 300 es\nprecision highp float;\nin vec4 position;\nvoid main(){gl_Position=position;}';
    var FRAG = [
      '#version 300 es',
      'precision highp float;',
      'out vec4 O;',
      'uniform vec2 resolution;',
      'uniform float time;',
      '#define FC gl_FragCoord.xy',
      '#define T time',
      '#define R resolution',
      '#define MN min(R.x,R.y)',
      'float rnd(vec2 p){p=fract(p*vec2(12.9898,78.233));p+=dot(p,p+34.56);return fract(p.x*p.y);}',
      'float noise(in vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);float a=rnd(i),b=rnd(i+vec2(1,0)),c=rnd(i+vec2(0,1)),d=rnd(i+1.);return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}',
      'float fbm(vec2 p){float t=.0,a=1.;mat2 m=mat2(1.,-.5,.2,1.2);for(int i=0;i<5;i++){t+=a*noise(p);p*=2.*m;a*=.5;}return t;}',
      'float clouds(vec2 p){float d=1.,t=.0;for(float i=.0;i<3.;i++){float a=d*fbm(i*10.+p.x*.2+.2*(1.+i)*p.y+d+i*i+p);t=mix(t,d,a);d=a;p*=2./(i+1.);}return t;}',
      'void main(){',
      '  vec2 uv=(FC-.5*R)/MN, st=uv*vec2(2.,1.);',
      '  vec3 col=vec3(0.);',
      '  float bg=clouds(vec2(st.x+T*.4,-st.y));',
      '  uv*=1.-.3*(sin(T*.2)*.5+.5);',
      '  for(float i=1.;i<12.;i++){',
      '    uv+=.1*cos(i*vec2(.1+.01*i,.8)+i*i+T*.5+.1*uv.x);',
      '    vec2 p=uv;',
      '    float d=length(p);',
      '    col+=.00125/d*(cos(sin(i)*vec3(.6,3.2,2.8))+1.)*vec3(.3,.25,.95);',
      '    float b=noise(i+p+bg*1.731);',
      '    col+=.002*b/length(max(p,vec2(b*p.x*.02,p.y)))*vec3(.25,.2,.88);',
      '    col=mix(col,vec3(bg*.03,bg*.03,bg*.2),d);',
      '  }',
      '  col=clamp(col*.6,0.,1.);',
      '  O=vec4(col,1.);',
      '}'
    ].join('\n');

    function mkShader(type, src) {
      var s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.warn('Shader err:', gl.getShaderInfoLog(s));
        return null;
      }
      return s;
    }

    var vs = mkShader(gl.VERTEX_SHADER, VERT);
    var fs = mkShader(gl.FRAGMENT_SHADER, FRAG);
    if (!vs || !fs) { canvas.style.display = 'none'; return; }

    var prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { canvas.style.display = 'none'; return; }

    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,1,-1,-1,1,1,1,-1]), gl.STATIC_DRAW);
    var posLoc = gl.getAttribLocation(prog, 'position');
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    var uRes  = gl.getUniformLocation(prog, 'resolution');
    var uTime = gl.getUniformLocation(prog, 'time');

    function resize() {
      var dpr = Math.max(1, Math.min(window.devicePixelRatio, 2));
      canvas.width  = canvas.offsetWidth  * dpr;
      canvas.height = canvas.offsetHeight * dpr;
      gl.viewport(0, 0, canvas.width, canvas.height);
    }

    window.addEventListener('resize', resize);
    resize();

    function render(now) {
      gl.useProgram(prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.uniform2f(uRes,  canvas.width, canvas.height);
      gl.uniform1f(uTime, now * .001);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  }
})();
</script>
</body>
</html>
